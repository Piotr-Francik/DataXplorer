<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="inventorybackground">

<div class="inventory-header-strip">
  <div class="header-accent-strip">
    <div class="inventoryheader">Inventory</div>
  </div>
</div>

<div class="inventory-grid">


<div id="factfile-popup" class="popup">
  <div class="popup-content">
    <span class="close-btn">&times;</span>

    <div class="popup-banner-top">
      <span>YOU HAVE FOUND:</span>
    </div>

    <!-- Main Content Area -->
    <div class="popup-body">
      <img id="popup-img" src="" alt="Factfile Detail Image">

      <!-- Wrap title and description together so they stack on the right -->
      <div class="popup-info">
        <div class="popupheader" id="popup-title">Factfile Title</div>
        <div class="inventorytext" id="popup-desc">Factfile description</div>
      </div>
    </div>

    <div class="popup-banner-bottom">
      <div class="footer-left"></div>
      <div class="footer-right"></div>
    </div>
  </div>
</div>

  <!-- Item 1 -->
<div class="inventory-card"
  data-title="Lophelia pertusa"
  data-img="Lophelia pertusa.jpg"
  data-desc="Family:
  
    Order:
    Length:
    Conservation status:
     Lophelia pertusa is a cold-water reef-building coral found in deep ocean waters.">
  
  <div class="image-wrapper">
    <img src="Lophelia pertusa.jpg" alt="Lophelia pertusa">
  </div>
  <div class="inventorytext">Lophelia pertusa</div>
</div>

  <!-- Item 2 -->
  <div class="inventory-card" 
  data-title="Enallopsammia rostrata"
  data-img="Enallopsammia rostrata.jpg"
  data-desc="Family:
  
    Order:
    Length:
    Conservation status:
    Desctiption">
    
    <div class="image-wrapper">
      <img src="Enallopsammia rostrata.jpg" alt="Enallopsammia rostrata">
    </div>
    <div class="inventorytext">Enallopsammia rostrata</div>
  </div>

  <div class="inventory-card-empty">
  <div class="image-wrapper">
    <span class="placeholder-icon">?</span>
  </div>
  <div class="inventorytext">Unknown</div>
</div>

  <!-- Item 4 -->
  <div class="inventory-card"
  data-title="Coffinfish"
  data-img="coffinfish.jpg"
  data-desc="Family:
  
    Order:
    Length:
    Conservation status:
    Desctiption">
    
    <div class="image-wrapper">
      <img src="coffinfish.jpg" alt="Coffinfish">
    </div>
    <div class="inventorytext">Coffinfish</div>
  </div>

  <div class="inventory-card-empty">
  <div class="image-wrapper">
    <span class="placeholder-icon">?</span>
  </div>
  <div class="inventorytext">Unknown</div>
</div>

  <div class="inventory-card-empty">
  <div class="image-wrapper">
    <span class="placeholder-icon">?</span>
  </div>
  <div class="inventorytext">Unknown</div>
</div>

  <div class="inventory-card-empty">
  <div class="image-wrapper">
    <span class="placeholder-icon">?</span>
  </div>
  <div class="inventorytext">Unknown</div>
</div>

<div class="inventory-card-empty">
  <div class="image-wrapper">
    <span class="placeholder-icon">?</span>
  </div>
  <div class="inventorytext">Unknown</div>
</div>

</div>


</div>

<script src="inventoryscript.js"></script>

</body>
</html>
