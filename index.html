<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="load.css">
    <title>Data Xplorer</title>
</head>

<body>
    <style>
        body {
            margin: 0px;
        }
    </style>
    <script type="module" src="game.js"></script>
    <script type="module" src="main.js"></script>
    <!--<button style="position: absolute;" id="debug_button">Next Scene</button>-->


    <div class="ui-layer">
        <button class="start-btn" id="start-btn">Click here to Proceed</button>
    </div>

    <link rel="stylesheet" href="loading-screen.css">

    <div id="loading-screen">

        <div class="logo-bar">
            <img src="/public/resources/brand/OceanX.avif">
            <div class="logo-divider"></div>
            <img src="/public/resources/brand/UOB.webp">
        </div>

        <h1 class="title">DATA XPLORER</h1>

        <div class="preview-row">
            <img src="public/resources/images/sand.png">
            <img src="public/resources/images/sand.png">
            <img src="public/resources/images/sand.png">
        </div>

        <button id="play-button" class="loading"><h1>LOADING</h1></button>

    </div>

    <div id="scene-4-overlay" style="display: none;">
        <div class="overlay-content">
            <div class="text">You are now going down into the water column.</div>
            <div class="text">Use the CTD data to explore points of interest.</div>
            <div class="text">Keep an eye out for changes in the conditions or any curious life forms you might see.
            </div>
            <button id="scene-4-next-btn" class="start-btn">Continue</button>
        </div>
    </div>
</body>

</html>
